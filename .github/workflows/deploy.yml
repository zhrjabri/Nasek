name: Verify

# This workflow checks. It does not publish.
#
# NASEK deploys through Vercel, which builds from the repository itself, so a
# second pipeline pushing a second copy of the site to GitHub Pages was two
# deployments of the same commit to two addresses — and only one of them was
# the one anybody was given. The Pages jobs are gone; Vercel is the only thing
# that ships.
#
# What is left is the half that was always worth having: a build of all three
# applications and the verification suite, run on every pull request and on
# every push to main, so a change that breaks one of them says so here rather
# than in a deployment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. The `pages: write` and `id-token: write` grants went with the
# Pages deployment that needed them; nothing here writes anything.
permissions:
  contents: read

# Per-branch rather than the single global `pages` group this used to share
# with the deployment. Two branches verifying at once is fine and normal; a
# superseded run of the same branch is just waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can fail.
  #
  # `npm run build` builds all three applications — the customer website, the
  # Campaign Owner Portal and the administration dashboard — and `npm run
  # verify` ends with `verify:isolation`, which reads the *built* bundles and
  # fails if an administration or owner string reached the public one.
  #
  # That is the reason this job builds before it verifies rather than after.
  # The separation between the three applications is exactly the sort of
  # property that stays true until someone imports a helper across it, and
  # nothing else in the pipeline would notice.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Build all three applications
        run: npm run build
        env:
          # Required. `assertBackendConfigured()` refuses to produce a
          # production bundle without these, because a bundle built without
          # them has no Supabase client and would fall back to a sign-in code
          # generated in the visitor's own browser — a deployment that
          # authenticates nobody while looking like it works.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # The deployed address of each application, baked in so that a
          # sign-in or invitation email points at the right one rather than at
          # whatever origin the browser happened to be on. Unset is a warning,
          # not a failure — which is right for a job that only verifies.
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_OWNER_URL: ${{ secrets.VITE_OWNER_URL }}
          VITE_ADMIN_URL: ${{ secrets.VITE_ADMIN_URL }}

      - run: npm run verify

      # Kept so a build can be inspected without reproducing it locally.
      #
      # All three now, where this used to upload the administration bundle
      # alone. That asymmetry only existed because the other two had a
      # publishing path and this one did not; with nothing published from here,
      # the three are equally worth being able to look at.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            dist-owner
            dist-admin
          retention-days: 7
