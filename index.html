<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10402F" />
    <title>Nasek ناسِك</title>
    <meta
      name="description"
      content="ناسِك — منصة عُمانية تجمع حملات الحج والعمرة في مكان واحد. اكتشف الحملات المعتمدة، واطّلع على الأسعار والخدمات والتقييمات، واحجز رحلتك بثقة."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Droid Arabic Kufi is only published through the Google Fonts "early
      access" endpoint, which has no versioning and can be flaky. Noto Kufi
      Arabic loads from the supported API right behind it as a same-genre
      fallback, so the page never drops to a non-Kufi Arabic face.
    -->
    <link href="https://fonts.googleapis.com/earlyaccess/droidarabickufi.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
