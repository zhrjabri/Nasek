<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F5132" />
    <title>Nasek ناسِك</title>
    <meta
      name="description"
      content="ناسِك — منصة عُمانية تجمع حملات الحج والعمرة في مكان واحد. اكتشف الحملات المعتمدة، واطّلع على الأسعار والخدمات والتقييمات، واحجز رحلتك بثقة."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Noto Kufi Arabic is the Kufi face, and now the only one.

      Droid Arabic Kufi used to be listed ahead of it, loaded from the Google
      Fonts "early access" endpoint. Google has retired the files behind that
      endpoint: the stylesheet still serves, every `@font-face` in it still
      parses, and every URL it names — .woff2, .woff, .ttf, .eot — answers 404.
      So each page load fetched a render-blocking stylesheet and then failed six
      font requests, and Arabic rendered in Noto Kufi anyway, because that is
      what a failed face falls through to.

      Removing it changes no pixel. It removes a blocking request, six failures
      in every visitor's network log, and a font stack that named a face nobody
      has been served since Google withdrew it.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
